# Workflow actions are pinned to full commit SHAs with a `# vX.Y.Z` comment. Dependabot proposes
# SHA and comment bumps as pull requests; run a release preview after merging one. It does not
# bump setup-node's node-version or the npm install in publish.yml: update those by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
