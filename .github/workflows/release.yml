name: Release Simfinity

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the current version without tagging, publishing, or deploying
        type: boolean
        default: false

permissions:
  contents: read

# Keep every queued version; the default one-pending-run queue drops releases.
concurrency:
  group: simfinity-release
  queue: max

jobs:
  source:
    if: github.repository == 'simtlix/simfinity.js' && (github.ref == 'refs/heads/master' || inputs.dry_run)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      should_release: ${{ steps.release.outputs.shouldRelease }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select immutable release source
        id: release
        env:
          MODE: ${{ inputs.dry_run && 'preview' || github.event_name == 'workflow_dispatch' && 'retry' || 'auto' }}
        run: node scripts/release-state.js "$MODE" >> "$GITHUB_OUTPUT"
      - name: Explain unchanged version
        if: steps.release.outputs.shouldRelease != 'true'
        run: echo 'This version already has a release tag. Change the aligned workspace version in a PR to release new library code.' >> "$GITHUB_STEP_SUMMARY"

  packages:
    needs: source
    if: needs.source.outputs.should_release == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.source.outputs.tag }}
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ inputs.dry_run || false }}
    permissions:
      contents: write
      packages: write
      id-token: write

  github-release:
    needs: [source, packages]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prevent an old retry from replacing the latest release
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - uses: actions/download-artifact@v8
        with:
          name: npm-verification
          path: ${{ runner.temp }}/simfinity-release
      - name: Create release notes and attach verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/simfinity-release/"* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          echo "Released $RELEASE_TAG after both registries and npm integrity checks passed." >> "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: [source, github-release]
    if: ${{ !inputs.dry_run && needs.source.outputs.prerelease != 'true' }}
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
      source_ref: ${{ needs.source.outputs.commit }}
    permissions:
      contents: read
      pages: write
      id-token: write
