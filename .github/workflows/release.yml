name: Release Simfinity

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  # Manual runs are previews only; publication requires a tag or release event.
  workflow_dispatch:

permissions:
  contents: read

# Keep every queued version; the default one-pending-run queue drops releases.
concurrency:
  group: simfinity-release
  queue: max

jobs:
  source:
    # Independently versioned tools have their own release tags.
    if: github.repository == 'simtlix/simfinity.js' && !github.event.deleted && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select immutable release source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            node scripts/release-state.js preview >> "$GITHUB_OUTPUT"
          else
            node scripts/release-state.js release "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
          fi

  packages:
    needs: source
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.source.outputs.tag }}
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      id-token: write

  github-release:
    needs: [source, packages]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prevent an old retry from replacing the latest release
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-verification
          path: ${{ runner.temp }}/simfinity-release
      # Only the verified manifest, its archives and the npm evidence are attached, never other artifact files.
      - name: Verify the archives against the packed manifest digest
        env:
          SIMFINITY_RELEASE_MANIFEST_SHA256: ${{ needs.packages.outputs.manifest_sha256 }}
        run: node scripts/release-packages.js assets "$RUNNER_TEMP/simfinity-release/manifest.json" > "$RUNNER_TEMP/release-assets.txt"
      # A complete listing decides creation, so a failed lookup never adds a second release for the tag.
      - name: Find the GitHub release for this tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/github-release.js find "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Create release notes and attach verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
          RELEASE_EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          case "$RELEASE_EXISTS" in
            true) ;;
            false) gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft ;;
            *) echo 'The GitHub release lookup did not complete' >&2; exit 1 ;;
          esac
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          # The package version, not the release form, decides pre-release and latest.
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            # GitHub cannot mark a pre-release as latest: clear the flag in its own call first.
            gh release edit "$RELEASE_TAG" --prerelease=false
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          echo "Released $RELEASE_TAG after both registries and npm integrity checks passed." >> "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: [source, github-release]
    if: github.event_name != 'workflow_dispatch' && needs.source.outputs.prerelease != 'true'
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
      source_ref: ${{ needs.source.outputs.commit }}
    # docs.yml's gate reads the live github-pages deployment; a called workflow gets no scope its caller lacks.
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read
