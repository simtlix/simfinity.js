name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Increment the version, or use the already prepared current version
        type: choice
        options: [patch, minor, major, current]
        default: patch
      draft:
        description: Create a draft release
        type: boolean
        default: false
      dry_run:
        description: Validate and preview without creating a commit, tag, or release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check release branch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ] && [ "$DRY_RUN" != true ]; then
            echo 'Create releases from master. Other branches support dry runs only.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/release-packages.js check
      - run: npm run lint
      - run: npm test
      - name: Prepare all workspace versions
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          git diff --exit-code HEAD
          case "$VERSION_BUMP" in
            patch|minor|major) npm version "$VERSION_BUMP" --no-git-tag-version --ignore-scripts --workspaces=false ;;
            current) ;;
            *) echo 'Choose patch, minor, major, or current.' >&2; exit 1 ;;
          esac
          release_version=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version)')
          node scripts/release-packages.js version "$release_version"
          release_tag="v$release_version"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag $release_tag already exists; it will not be overwritten." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - run: npm run test:packages
      - name: Validate all local preview archives
        run: |
          node scripts/release-packages.js pack "$RUNNER_TEMP/simfinity-release-preview"
          node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release-preview/manifest.json" --registry npm --dry-run
      - name: Preview release
        if: inputs.dry_run
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Validated four packages for $RELEASE_TAG. Preview archives are local to this run. No commit, tag, release, or package was published." >> "$GITHUB_STEP_SUMMARY"
      - name: Create version commit, tag, and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json packages/core/package.json packages/mcp/package.json packages/postgres/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$RELEASE_TAG"
          release_url=$(gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" --draft="$DRAFT")
          echo "Created [$RELEASE_TAG]($release_url). Package publication is a separate manual workflow." >> "$GITHUB_STEP_SUMMARY"
