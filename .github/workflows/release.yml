name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
      draft:
        description: Create a draft release
        type: boolean
        default: false
      dry_run:
        description: Validate and preview without creating a commit, tag, or release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check release branch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ] && [ "$DRY_RUN" != true ]; then
            echo 'Create releases from master. Other branches support dry runs only.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Prepare release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          case "$VERSION_BUMP" in
            patch|minor|major) ;;
            *) echo 'Choose patch, minor, or major.' >&2; exit 1 ;;
          esac
          npm version "$VERSION_BUMP" --no-git-tag-version --ignore-scripts
          release_tag="v$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag $release_tag already exists; it will not be overwritten." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          npm pack --dry-run --ignore-scripts
      - name: Preview release
        if: inputs.dry_run
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Release preview: $RELEASE_TAG. No commit, tag, release, or package was published." >> "$GITHUB_STEP_SUMMARY"
      - name: Create version commit, tag, and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$RELEASE_TAG"
          release_url=$(gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" --draft="$DRAFT")
          echo "Created [$RELEASE_TAG]($release_url). Package publication is a separate manual workflow." >> "$GITHUB_STEP_SUMMARY"
