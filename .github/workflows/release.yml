name: Release Simfinity

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  # Manual runs are previews only; publication requires a tag or release event.
  workflow_dispatch:

permissions:
  contents: read

# Keep every queued version; the default one-pending-run queue drops releases.
concurrency:
  group: simfinity-release
  queue: max

jobs:
  source:
    if: github.repository == 'simtlix/simfinity.js' && !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select immutable release source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            node scripts/release-state.js preview >> "$GITHUB_OUTPUT"
          else
            node scripts/release-state.js release "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
          fi

  packages:
    needs: source
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.source.outputs.tag }}
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      id-token: write

  github-release:
    needs: [source, packages]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prevent an old retry from replacing the latest release
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - uses: actions/download-artifact@v8
        with:
          name: npm-verification
          path: ${{ runner.temp }}/simfinity-release
      - name: Create release notes and attach verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/simfinity-release/"* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          echo "Released $RELEASE_TAG after both registries and npm integrity checks passed." >> "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: [source, github-release]
    if: github.event_name != 'workflow_dispatch' && needs.source.outputs.prerelease != 'true'
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
      source_ref: ${{ needs.source.outputs.commit }}
    permissions:
      contents: read
      pages: write
      id-token: write
