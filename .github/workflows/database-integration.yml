name: Database integration

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Master pushes and release runs
# that call this workflow (github.* is the caller's there) each get their own group and always
# complete.
concurrency:
  group: database-integration-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    # MongoDB 8 refuses the newer kernels on ubuntu-24.04 (SERVER-121912).
    # Keep the database matrix on the 22.04 runner's compatible kernel until
    # the MongoDB images support the newer runner; retain every database version.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '15-alpine'
            mongo: '7.0'
            database: pg15_mongo7
          - postgres: '16-alpine'
            mongo: '8.0'
            database: pg16_mongo8
          - postgres: '18-alpine'
            mongo: '8.0'
            database: pg18_mongo8
    services:
      mongo-standalone:
        image: mongo:${{ matrix.mongo }}
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: simfinity
          POSTGRES_DB: simfinity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start disposable MongoDB replica set
        env:
          MONGO_VERSION: ${{ matrix.mongo }}
        run: |
          docker run -d --name simfinity-mongo -p 27017:27017 "mongo:${MONGO_VERSION}" --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec simfinity-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec simfinity-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for _ in $(seq 1 60); do
            if docker exec simfinity-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run full database suite
        run: npm test
        env:
          SIMFINITY_MONGODB_URI: mongodb://127.0.0.1:27017/simfinity_contract_${{ matrix.database }}?replicaSet=rs0&directConnection=true
          SIMFINITY_STANDALONE_MONGODB_URI: mongodb://127.0.0.1:27018/simfinity_standalone_${{ matrix.database }}
          SIMFINITY_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/simfinity_upstream_${{ matrix.database }}?replicaSet=rs0&directConnection=true
          SIMFINITY_POSTGRES_URI: postgresql://postgres:simfinity@127.0.0.1:5432/simfinity_test
      - if: always()
        run: docker rm -f simfinity-mongo
