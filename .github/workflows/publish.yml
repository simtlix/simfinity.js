name: Publish packages

# Called explicitly by release.yml for tag pushes and published GitHub releases.
# npm trusts the calling release.yml identity.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    outputs:
      manifest_sha256:
        description: SHA-256 of the release manifest the pack job recorded; it pins every archive hash.
        value: ${{ jobs.pack.outputs.manifest_sha256 }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs. Node and npm are exact where archives are packed or
# published; Dependabot does not bump node-version or the npm install, so bump those by hand.
jobs:
  pack:
    # Pack from the fresh checkout before any dependency install or test of this run executes
    # third-party code. Only this job can set its outputs, so the publish jobs compare the
    # downloaded manifest with the digest recorded here and reject a replaced artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node (and bundled npm 11.19.0) that packed 3.6.0.
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/release-state.js verify-source "$RELEASE_TAG" "$SOURCE_COMMIT" --preview
          else
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            node scripts/release-state.js verify-source "$RELEASE_TAG" "$SOURCE_COMMIT"
          fi
      - name: Pack committed release source
        id: pack
        run: |
          node scripts/release-packages.js pack "$RUNNER_TEMP/simfinity-release"
          node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry npm --dry-run
          digest=$(sha256sum "$RUNNER_TEMP/simfinity-release/manifest.json")
          echo "manifest_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - run: npm ci
      - run: npm run test:security
      - run: npm run lint
      - run: npm test
      - name: Test the packed release archives as isolated consumers
        # Consistency, not security: code run by npm ci in this job could change this check.
        # The publish jobs enforce the digest.
        run: npm run test:packages -- "$RUNNER_TEMP/simfinity-release/manifest.json"
        env:
          SIMFINITY_RELEASE_MANIFEST_SHA256: ${{ needs.pack.outputs.manifest_sha256 }}

  databases:
    needs: build
    uses: ./.github/workflows/database-integration.yml
    with:
      source_ref: ${{ inputs.commit }}

  verify-tag:
    if: ${{ !inputs.dry_run }}
    needs: [build, databases]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Recheck the existing release tag after validation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: node scripts/release-state.js verify-source "$RELEASE_TAG" "$SOURCE_COMMIT"

  publish-npm:
    needs: [pack, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prevent a superseded retry from changing npm distribution tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # The npm that published 3.5.5 to 3.6.0 through Trusted Publishing (needs 11.5.1 or later).
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - name: Publish through npm Trusted Publishing (OIDC)
        run: node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry npm --execute
        env:
          SIMFINITY_RELEASE_COMMIT: ${{ inputs.commit }}
          SIMFINITY_RELEASE_MANIFEST_SHA256: ${{ needs.pack.outputs.manifest_sha256 }}
      - name: Verify npm visibility, distribution tags and archive integrity
        run: node scripts/verify-published.js "$RUNNER_TEMP/simfinity-release/manifest.json" > "$RUNNER_TEMP/simfinity-release/npm-verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-verification
          overwrite: true
          path: ${{ runner.temp }}/simfinity-release/npm-verification.json
          if-no-files-found: error
          retention-days: 30

  publish-gpr:
    # Keep GPR behind verified npm so the shared npm freshness guard also
    # protects failed-job retries from rolling GPR distribution tags backward.
    needs: [pack, verify-tag, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prevent a superseded retry from changing package distribution tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-state.js verify-current "${RELEASE_TAG#v}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://npm.pkg.github.com/
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - name: Publish verified archives in dependency order
        run: node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry github --execute
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SIMFINITY_RELEASE_COMMIT: ${{ inputs.commit }}
          SIMFINITY_RELEASE_MANIFEST_SHA256: ${{ needs.pack.outputs.manifest_sha256 }}
