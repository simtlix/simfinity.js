name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v3.3.0
        type: string
        required: true
      registry:
        description: Package registry
        type: choice
        options: [npm, github, both]
        default: npm
      dry_run:
        description: Validate the archives without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check publication branch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ] && [ "$DRY_RUN" != true ]; then
            echo 'Publish from the master workflow. Other branches support dry runs only.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release tag and source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node scripts/release-packages.js check
          version=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version)')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo 'The tag must match every package version.' >&2
            exit 1
          fi
          if [ "$DRY_RUN" != true ]; then
            git merge-base --is-ancestor HEAD refs/remotes/origin/master
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:packages
      - name: Pack the validated committed source
        run: |
          git diff --exit-code HEAD
          node scripts/release-packages.js pack "$RUNNER_TEMP/simfinity-release"
          node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry npm --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Preview publication
        if: inputs.dry_run
        run: |
          echo 'Validated all five package archives. No registry lookup or publication was performed by the publisher.' >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    if: ${{ !inputs.dry_run && (inputs.registry == 'npm' || inputs.registry == 'both') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - name: Publish verified archives in dependency order
        run: node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry npm --execute
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          SIMFINITY_RELEASE_COMMIT: ${{ needs.build.outputs.commit }}

  publish-gpr:
    if: ${{ !inputs.dry_run && (inputs.registry == 'github' || inputs.registry == 'both') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: ${{ runner.temp }}/simfinity-release
      - name: Publish verified archives in dependency order
        run: node scripts/publish-packages.js "$RUNNER_TEMP/simfinity-release/manifest.json" --registry github --execute
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SIMFINITY_RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
