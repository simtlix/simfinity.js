name: simfinity-example-barber-mongodb
services:
  db:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGODB_PORT:-57417}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'try { rs.status(); } catch { rs.initiate({_id:"rs0",members:[{_id:0,host:"db:27017"}]}); } if (!db.hello().isWritablePrimary) quit(1);']
      interval: 3s
      timeout: 5s
      retries: 40
  backend:
    build: ./mongodb
    environment:
      MONGO: mongodb://db:27017/barber?replicaSet=rs0
      PORT: 4300
      GRAPHQL_ENDPOINT: http://localhost:4300/graphql
      JWT_SECRET: ${JWT_SECRET:-example-barber-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-example-barber-refresh-secret}
      SEED_ADMIN_EMAIL: admin@demo.com
      SEED_ADMIN_PASSWORD: demo1234
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGODB_BACKEND_PORT:-4400}:4300"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mongodb_uploads:/app/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://${PUBLIC_HOST:-localhost}:${MONGODB_BACKEND_PORT:-4400}/graphql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGODB_FRONTEND_PORT:-4401}:4301"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4301').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mongodb_data:
  mongodb_uploads:
